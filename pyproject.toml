[project]
name = "ai-engineer-path"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-engineer-path = "ai_engineer_path:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
